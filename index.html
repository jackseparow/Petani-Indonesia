<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petani Bijaksana - Gim Edutainment Numerasi</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0fdf4; color: #166534; margin: 0; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    h1 { text-align: center; color: #15803d; margin-bottom: 20px; font-size: 2.2em; }
    
    .status-hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #dcfce7; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; margin-bottom: 20px; }
    .status-card { background: #ffffff; padding: 10px; border-radius: 8px; border: 1px solid #bbf7d0; }
    .status-card span { display: block; font-size: 1.2em; color: #16a34a; }
    
    .farm-section { text-align: center; }
    .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 20px 0; }
    .tile { background: #fef3c7; border: 2px dashed #d97706; border-radius: 10px; height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .tile:hover { background: #fde68a; transform: translateY(-2px); }
    .tile.planted { background: #dcfce7; border: 2px solid #16a34a; }
    .tile-icon { font-size: 1.5em; }
    .tile-add { font-size: 1.5em; color: #d97706; }

    .control-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; background: #f8fafc; padding: 15px; border-radius: 10px; }
    .control-group label { font-weight: bold; display: block; margin-bottom: 5px; }
    .control-group input { width: 80%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }

    .btn-simulasi { width: 100%; background: #16a34a; color: white; border: none; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    .btn-simulasi:hover { background: #15803d; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .crop-option { padding: 10px; border-bottom: 1px solid #e2e8f0; cursor: pointer; }
    .crop-option:hover { background: #f1f5f9; }

    #log-area { margin-top: 25px; }
    .log-entry { background: #1e293b; color: #f8fafc; padding: 12px; border-radius: 8px; font-family: monospace; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h1>👨‍🌾 Petani Bijaksana</h1>

  <div class="status-hud">
    <div class="status-card">Musim Tanam<span id="lbl-season">1</span></div>
    <div class="status-card">Kesehatan Tanah<span id="lbl-soil">100%</span></div>
    <div class="status-card">Estimasi Air<span id="preview-water">0 / 100</span></div>
    <div class="status-card">Kas Uang<span id="lbl-money">Rp 0</span></div>
  </div>

  <div class="farm-section">
    <h3>Petak Lahan Pertanian (Klik Petak untuk Menanam)</h3>
    <div class="grid-container" id="farm-grid"></div>
  </div>

  <div class="control-panel">
    <div class="control-group">
      <label>Buah Rusak Ditinggal (Humus Alami):</label>
      <input type="number" id="inp-humus" value="0" min="0"> Unit
    </div>
    <div class="control-group">
      <label>Booster Kimia (Sintetis):</label>
      <input type="number" id="inp-booster" value="0" min="0"> Dosis
    </div>
  </div>

  <button class="btn-simulasi" onclick="runSeasonSimulation()">Proses Musim Panen ➔</button>

  <div id="log-area">
    <h3>Catatan Evaluasi Petani Bijaksana</h3>
    <div id="log-content"></div>
  </div>
</div>

<div class="modal-overlay" id="crop-modal">
  <div class="modal-content">
    <h3>Pilih Tanaman untuk Petak Ini</h3>
    <div id="modal-crop-list"></div>
    <button onclick="closeModal()" style="margin-top:15px; padding:8px 16px;">Batal</button>
  </div>
</div>

<script src="engine.js"></script>
</body>
</html>
